<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Идеи</title>
<style>
:root{--bg:#eef0f4;--side:#e3e6ed;--card:#fff;--col:#e6e9f0;--tx:#1d2130;--mu:#6b7287;--ln:#d3d8e3;--ac:#5b5bd6;--acx:#fff;--dn:#d6455d;--ok:#2f9e6e;--sh:0 1px 2px rgba(20,25,50,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--side:#181b24;--card:#232733;--col:#1a1d27;--tx:#e8eaf2;--mu:#8b92a8;--ln:#2d3242;--ac:#8484ff;--acx:#12141b;--dn:#ff6b81;--ok:#4cc794;--sh:none}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:140px}
.btn{padding:9px 16px;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:500}
.btn.d{background:transparent;color:var(--dn);border:1px solid var(--dn);font-weight:500}
.ib{width:28px;height:28px;border-radius:8px;color:var(--mu);font-size:14px}
.ib:hover{background:var(--ln);color:var(--tx)}
aside{width:280px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:16px;gap:12px;border-right:1px solid var(--ln)}
aside h1{font-size:20px;margin:0;letter-spacing:-.02em}
#gl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px}
.g-it{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 12px;border-radius:10px;cursor:pointer}
.g-it:hover{background:var(--ln)}
.g-it.on{background:var(--ac);color:var(--acx)}
.g-it.over{outline:2px dashed var(--ac)}
.g-it .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-it .c{font-size:12px;opacity:.7;min-width:18px;text-align:right}
.g-it .ib{display:none;color:inherit}
.g-it:hover .ib,.g-it.on .ib{display:inline-block}
.g-it.on .ib:hover{background:rgba(255,255,255,.2)}
.side-ft{display:flex;gap:8px}
.side-ft .btn{flex:1;padding:7px;font-size:13px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:16px 20px;flex-wrap:wrap}
header h2{margin:0;font-size:22px;letter-spacing:-.02em;margin-right:auto}
header input{width:220px}
#menu{display:none}
#board{flex:1;overflow:auto;display:flex;gap:14px;padding:4px 20px 20px;align-items:flex-start}
.col{width:300px;flex:none;background:var(--col);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:100%}
.col.over{outline:2px dashed var(--ac)}
.ch{display:flex;align-items:center;gap:4px;padding:0 2px}
.ch b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch span{color:var(--mu);font-size:13px}
.cards{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:30px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--sh);border:1px solid var(--ln);cursor:pointer}
.card:hover{border-color:var(--ac)}
.card.drag{opacity:.35}
.card.done{opacity:.55}
.card.done .t{text-decoration:line-through}
.chk{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mu);margin-top:1px;display:grid;place-items:center;color:transparent;font-size:12px;line-height:1}
.card.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.t{word-break:break-word}
.pv{font-size:13px;color:var(--mu);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.sep{font-size:12px;color:var(--mu);border-top:1px dashed var(--ln);padding-top:8px;margin-top:4px}
.add{padding:8px;border-radius:10px;color:var(--mu);text-align:left}
.add:hover{background:var(--ln);color:var(--tx)}
.newcol{width:300px;flex:none;border:2px dashed var(--ln);border-radius:16px;padding:14px;color:var(--mu)}
.newcol:hover{border-color:var(--ac);color:var(--ac)}
.empty{color:var(--mu);padding:30px}
dialog{border:0;border-radius:18px;padding:22px;width:min(480px,92vw);background:var(--bg);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,20,.55)}
dialog h3{margin:0 0 14px;font-size:18px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--mu)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.act .sp{margin-right:auto}
.lbl{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin-bottom:12px;cursor:pointer}
.lbl input{width:auto}
@media(max-width:760px){
aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;width:84vw;max-width:320px}
body.open aside{transform:none}
#menu{display:inline-block}
.g-it .ib{display:inline-block}
header input{width:100%;order:9}
.col,.newcol{width:82vw}
#board{scroll-snap-type:x proximity}
}
.mv{display:none;flex-direction:column;margin-left:auto;flex:none}
.mv button{width:28px;height:22px;color:var(--mu);font-size:11px;border-radius:6px}
.mv button:active{background:var(--ln)}
@media(hover:none),(max-width:760px){.mv{display:flex}}
.bn{margin:0 20px 12px;padding:12px 14px;border-radius:12px;background:var(--col);border:1px solid var(--ln);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bn span{flex:1;min-width:200px}
.bn .btn{padding:6px 12px;font-size:13px}
.msg{font-size:13px;margin:8px 0;color:var(--mu)}.msg.e{color:var(--dn)}.msg.o{color:var(--ok)}
.hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside>
  <h1>Идеи</h1>
  <input id="gq" type="search" placeholder="Поиск группы">
  <div id="gl"></div>
  <button class="btn" id="ng">+ Новая группа</button>
  <div class="side-ft">
    <button class="btn g" id="ex">Экспорт</button>
    <button class="btn g" id="im">Импорт</button>
  </div>
  <button class="btn g" id="st">Настройки и бэкап</button>
  <input type="file" id="fi" accept=".json,application/json" hidden>
</aside>
<main>
  <header>
    <button class="ib" id="menu" aria-label="Группы">☰</button>
    <h2 id="gt"></h2>
    <input id="iq" type="search" placeholder="Поиск записи в группе">
    <button class="btn g" id="nc">+ Столбец</button>
    <button class="btn" id="ni">+ Запись</button>
  </header>
  <div id="bn"></div>
  <div id="board"></div>
</main>
<dialog id="m"></dialog>

<script>
const K='ideas-app-v1',$=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkGroup=(name,id)=>({id:id||uid(),name,cols:[{id:uid(),name:'Идеи'}],items:[]});
function fix(d){
  if(!d||!Array.isArray(d.groups))return null;
  if(!d.groups.find(g=>g.id==='inbox'))d.groups.unshift(mkGroup('Не отсортированное','inbox'));
  d.groups.forEach(g=>{g.cols=g.cols||[];g.items=g.items||[];if(!g.cols.length)g.cols.push({id:uid(),name:'Идеи'});
    g.items.forEach(i=>{if(!g.cols.find(c=>c.id===i.col))i.col=g.cols[0].id})});
  if(!d.groups.find(g=>g.id===d.cur))d.cur='inbox';
  return d;
}
let S;
try{S=fix(JSON.parse(localStorage.getItem(K)))}catch(e){}
S=S||fix({groups:[]});
let gq='',iq='',drag=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const grp=id=>S.groups.find(g=>g.id===id);
const cur=()=>grp(S.cur);
const undone=g=>g.items.filter(i=>!i.done).length;

function render(){
  const q=gq.trim().toLowerCase();
  $('#gl').innerHTML=S.groups.filter(g=>!q||g.name.toLowerCase().includes(q)).map(g=>
    `<div class="g-it ${g.id===S.cur?'on':''}" data-g="${g.id}"><span class="n">${esc(g.name)}</span><span class="c">${undone(g)}</span>
    <button class="ib" data-a="eg" data-g="${g.id}" title="Переименовать">✎</button>${g.id!=='inbox'?`<button class="ib" data-a="dg" data-g="${g.id}" title="Удалить">✕</button>`:''}</div>`).join('')||'<div class="empty">Групп не найдено</div>';
  const g=cur();$('#gt').textContent=g.name;
  const f=iq.trim().toLowerCase();
  $('#board').innerHTML=g.cols.map(c=>{
    const all=g.items.filter(i=>i.col===c.id&&(!f||i.title.toLowerCase().includes(f)));
    const a=all.filter(i=>!i.done),d=all.filter(i=>i.done);
    return `<section class="col" data-c="${c.id}"><div class="ch"><b>${esc(c.name)}</b><span>${a.length}</span>
      <button class="ib" data-a="ec" data-c="${c.id}" title="Переименовать">✎</button>
      ${g.cols.length>1?`<button class="ib" data-a="dc" data-c="${c.id}" title="Удалить столбец">✕</button>`:''}</div>
      <div class="cards">${a.map(card).join('')}${d.length?`<div class="sep">Сделано · ${d.length}</div>`+d.map(card).join(''):''}</div>
      <button class="add" data-a="ai" data-c="${c.id}">+ Добавить запись</button></section>`}).join('')
    +`<button class="newcol" data-a="nc">+ Новый столбец</button>`;banner();
}
const card=i=>`<div class="card ${i.done?'done':''}" draggable="true" data-i="${i.id}"><span class="chk" data-a="tg">✓</span>
  <div><div class="t">${esc(i.title)}</div>${i.note?`<div class="pv">${esc(i.note)}</div>`:''}</div>
  <div class="mv"><button data-a="up" aria-label="Выше">▲</button><button data-a="dn" aria-label="Ниже">▼</button></div></div>`;

/* ---------- dialogs ---------- */
const M=$('#m');
function open(html,mount){M.innerHTML=html;if(!M.open)M.showModal();mount&&mount();}
const close=()=>M.open&&M.close();
M.addEventListener('click',e=>{if(e.target===M)close()});
function ask(title,val,cb){
  open(`<h3>${title}</h3><div class="f"><input id="v" maxlength="80" value="${esc(val)}"></div>
  <div class="act"><button class="btn g" data-x>Отмена</button><button class="btn" id="ok">Сохранить</button></div>`,()=>{
    const v=$('#v');v.focus();v.select();
    const go=()=>{const t=v.value.trim();if(!t)return v.focus();close();cb(t)};
    $('#ok').onclick=go;v.onkeydown=e=>{if(e.key==='Enter')go()};
  });
}
function sure(text,cb){
  open(`<h3>${text}</h3><div class="act"><button class="btn g" data-x>Отмена</button><button class="btn d" id="ok">Удалить</button></div>`,()=>{$('#ok').onclick=()=>{close();cb()}});
}
M.addEventListener('click',e=>{if(e.target.closest('[data-x]'))close()});

const gOpts=sel=>S.groups.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}</option>`).join('');
const cOpts=(gid,sel)=>grp(gid).cols.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');

function quick(gid,cid){
  gid=gid||'inbox';
  open(`<h3>Новая запись</h3><div class="f"><input id="t" maxlength="200" placeholder="Что хочется не забыть?"></div>
  <div class="row"><label class="f">Группа<select id="g">${gOpts(gid)}</select></label>
  <label class="f">Столбец<select id="c">${cOpts(gid,cid)}</select></label></div>
  <div class="act"><button class="btn g" data-x>Закрыть</button><button class="btn" id="ok">Добавить</button></div>`,()=>{
    $('#t').focus();
    $('#g').onchange=()=>$('#c').innerHTML=cOpts($('#g').value);
    const go=()=>{const t=$('#t').value.trim();if(!t)return $('#t').focus();
      const g=grp($('#g').value);g.items.push({id:uid(),title:t,note:'',done:false,col:$('#c').value,ts:Date.now()});
      S.cur=g.id;save();close();render()};
    $('#ok').onclick=go;$('#t').onkeydown=e=>{if(e.key==='Enter')go()};
  });
}
function edit(id){
  const g=cur(),it=g.items.find(i=>i.id===id);if(!it)return;
  open(`<h3>Запись</h3><div class="f"><input id="t" maxlength="200" value="${esc(it.title)}"></div>
  <div class="f">Заметка<textarea id="n" placeholder="Детали, ссылки, мысли…">${esc(it.note)}</textarea></div>
  <div class="row"><label class="f">Группа<select id="g">${gOpts(g.id)}</select></label>
  <label class="f">Столбец<select id="c">${cOpts(g.id,it.col)}</select></label></div>
  <label class="lbl"><input type="checkbox" id="d" ${it.done?'checked':''}> Сделано</label>
  <div class="act"><button class="btn d sp" id="del">Удалить</button><button class="btn g" data-x>Отмена</button><button class="btn" id="ok">Сохранить</button></div>`,()=>{
    $('#g').onchange=()=>$('#c').innerHTML=cOpts($('#g').value);
    $('#del').onclick=()=>sure('Удалить запись?',()=>{g.items=g.items.filter(i=>i!==it);save();render()});
    $('#ok').onclick=()=>{const t=$('#t').value.trim();if(!t)return $('#t').focus();
      it.title=t;it.note=$('#n').value;it.done=$('#d').checked;
      const ng=grp($('#g').value);it.col=$('#c').value;
      if(ng!==g){g.items=g.items.filter(i=>i!==it);ng.items.push(it);S.cur=ng.id}
      save();close();render()};
    M.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('#ok').click()};
  });
}

/* ---------- actions ---------- */
function moveItem(id,gid,cid,beforeId){
  let src,it;
  S.groups.forEach(g=>{const f=g.items.find(i=>i.id===id);if(f){src=g;it=f}});
  if(!it)return;
  src.items=src.items.filter(i=>i!==it);
  const dst=grp(gid);
  it.col=cid||dst.cols[0].id;
  const bi=beforeId?dst.items.findIndex(i=>i.id===beforeId):-1;
  if(bi>=0)dst.items.splice(bi,0,it);else dst.items.push(it);
  save();render();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]'),gi=e.target.closest('.g-it'),cd=e.target.closest('.card');
  const a_=a&&a.dataset.a;
  if(a_==='tg'){const it=cur().items.find(i=>i.id===cd.dataset.i);it.done=!it.done;save();render();return}
  if(a_==='up'||a_==='dn'){step(cd.dataset.i,a_==='up'?-1:1);return}
  if(a_==='eg'){const g=grp(a.dataset.g);ask('Название группы',g.name,t=>{g.name=t;save();render()});return}
  if(a_==='dg'){const g=grp(a.dataset.g);sure(`Удалить группу «${esc(g.name)}»? Записи перейдут в «Не отсортированное»`,()=>{
    const ib=grp('inbox');g.items.forEach(i=>{i.col=ib.cols[0].id;ib.items.push(i)});
    S.groups=S.groups.filter(x=>x!==g);if(S.cur===g.id)S.cur='inbox';save();render()});return}
  if(a_==='ec'){const c=cur().cols.find(c=>c.id===a.dataset.c);ask('Название столбца',c.name,t=>{c.name=t;save();render()});return}
  if(a_==='dc'){const g=cur(),c=g.cols.find(c=>c.id===a.dataset.c);sure(`Удалить столбец «${esc(c.name)}»? Записи перейдут в соседний столбец`,()=>{
    g.cols=g.cols.filter(x=>x!==c);g.items.forEach(i=>{if(i.col===c.id)i.col=g.cols[0].id});save();render()});return}
  if(a_==='ai'){quick(S.cur,a.dataset.c);return}
  if(a_==='nc'){newCol();return}
  if(cd){edit(cd.dataset.i);return}
  if(gi){S.cur=gi.dataset.g;iq='';$('#iq').value='';save();render();document.body.classList.remove('open')}
});
function step(id,d){
  const g=cur(),it=g.items.find(i=>i.id===id);if(!it)return;
  const peers=g.items.filter(i=>i.col===it.col&&!!i.done===!!it.done),k=peers.indexOf(it)+d;
  if(k<0||k>=peers.length)return;
  const o=peers[k],a=g.items.indexOf(it),b=g.items.indexOf(o);
  g.items[a]=o;g.items[b]=it;save();render();
}
function newCol(){ask('Новый столбец','',t=>{cur().cols.push({id:uid(),name:t});save();render();const b=$('#board');b.scrollLeft=b.scrollWidth})}
$('#nc').onclick=newCol;
$('#ni').onclick=()=>quick(S.cur);
$('#ng').onclick=()=>ask('Новая группа','',t=>{const g=mkGroup(t);S.groups.push(g);S.cur=g.id;save();render()});
$('#gq').oninput=e=>{gq=e.target.value;render()};
$('#iq').oninput=e=>{iq=e.target.value;render()};
$('#menu').onclick=()=>document.body.classList.toggle('open');

/* ---------- drag & drop ---------- */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;
  drag=c.dataset.i;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag)});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))});
document.addEventListener('dragover',e=>{
  if(!drag)return;const t=e.target.closest('.col,.g-it');if(!t)return;
  e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==t&&x.classList.remove('over'));t.classList.add('over')});
document.addEventListener('drop',e=>{
  if(!drag)return;const id=drag,gi=e.target.closest('.g-it'),col=e.target.closest('.col');
  if(gi){e.preventDefault();moveItem(id,gi.dataset.g,null);return}
  if(col){e.preventDefault();const t=e.target.closest('.card');
    moveItem(id,S.cur,col.dataset.c,t&&t.dataset.i!==id?t.dataset.i:null)}
});

/* ---------- export / import ---------- */
function doExport(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='ideas-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);meta.lastExport=Date.now();saveMeta();render()}
$('#ex').onclick=doExport;
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{
    let d;try{d=fix(JSON.parse(r.result))}catch(x){}
    if(!d)return open(`<h3>Не удалось прочитать файл</h3><p>Выберите JSON, сохранённый через «Экспорт».</p><div class="act"><button class="btn" data-x>Понятно</button></div>`);
    open(`<h3>Импорт данных</h3><p>Заменить текущие данные файлом или добавить его группы к текущим?</p>
    <div class="act"><button class="btn g" data-x>Отмена</button><button class="btn g" id="mg">Добавить</button><button class="btn" id="rp">Заменить</button></div>`,()=>{
      $('#rp').onclick=()=>{S=d;save();close();render()};
      $('#mg').onclick=()=>{d.groups.forEach(g=>{const ex=grp(g.id);
        if(ex&&g.id==='inbox'){const m={};g.cols.forEach(c=>{const nc={id:uid(),name:c.name};m[c.id]=nc.id;ex.cols.push(nc)});g.items.forEach(i=>{i.col=m[i.col];ex.items.push(i)})}
        else if(!ex)S.groups.push(g);else{g.id=uid();S.groups.push(g)}});
        save();close();render()};
    })};
  r.readAsText(f)};

/* ---------- data protection ---------- */
const MK='ideas-app-meta-v1',SK='ideas-app-sync-v1',FN='app-backup.json',DAY=864e5;
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}};
let meta=rd(MK),sync=rd(SK);
const saveMeta=()=>{try{localStorage.setItem(MK,JSON.stringify(meta))}catch(e){}};
const saveSync=()=>{try{localStorage.setItem(SK,JSON.stringify(sync))}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
const fmt=t=>t?new Date(t).toLocaleDateString('ru',{day:'numeric',month:'long'}):'ни разу';
function banner(){
  const n=Date.now(),b=$('#bn');
  const need=(!meta.lastExport||n-meta.lastExport>=7*DAY)&&!(sync.lastBackup&&n-sync.lastBackup<7*DAY)&&!(meta.snooze>n);
  b.className=need?'bn':'';
  b.innerHTML=need?`<span>Копия данных давно не сохранялась. Файл: ${fmt(meta.lastExport)}, облако: ${fmt(sync.lastBackup)}.</span><button class="btn" id="bd">Скачать .json</button><button class="btn g" id="bs">Напомнить через 3 дня</button>`:'';
  if(need){$('#bd').onclick=doExport;$('#bs').onclick=()=>{meta.snooze=Date.now()+3*DAY;saveMeta();banner()}}
}
async function gh(path,opt={}){
  let r;
  try{r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+sync.token,Accept:'application/vnd.github+json'}})}
  catch(e){throw new Error('Нет соединения с GitHub. Проверьте интернет.')}
  if(r.status===401)throw new Error('Токен неверный или просрочен. Создайте новый.');
  if(r.status===403)throw new Error('GitHub отказал в доступе: лимит запросов или у токена нет права gist.');
  if(r.status===404)throw Object.assign(new Error('Бэкап не найден на GitHub.'),{st:404});
  if(!r.ok)throw new Error('Ошибка GitHub: '+r.status);
  return r.json();
}
async function doBackup(){
  let g;const files={[FN]:{content:JSON.stringify(S)}};
  if(sync.gistId){try{g=await gh('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify({files})})}catch(e){if(e.st!==404)throw e;sync.gistId=null}}
  if(!g){g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'App Backup',public:false,files})});sync.gistId=g.id}
  sync.lastBackup=Date.now();saveSync();banner();
}
async function findGist(){
  for(let p=1;p<=5;p++){
    const l=await gh('/gists?per_page=100&page='+p),f=l.find(x=>x.files&&x.files[FN]);
    if(f)return f.id;if(l.length<100)break}
  return null;
}
async function fetchBackup(){
  if(!sync.gistId){const id=await findGist();if(!id)return null;sync.gistId=id;saveSync()}
  const g=await gh('/gists/'+sync.gistId),f=g.files&&g.files[FN];
  if(!f)throw new Error('В гисте нет файла '+FN+'.');
  let t=f.content;
  if(f.truncated||t==null){const r=await fetch(f.raw_url);t=await r.text()}
  const d=fix(JSON.parse(t));if(!d)throw new Error('Бэкап повреждён.');return d;
}
async function settings(msg,cls){
  let ps='недоступно в этом браузере';
  try{if(navigator.storage&&navigator.storage.persisted)ps=(await navigator.storage.persisted())?'защищено от автоочистки':'не защищено: браузер может очистить данные при нехватке места'}catch(e){}
  open(`<h3>Настройки и бэкап</h3><p class="msg">Хранилище: ${ps}</p><hr class="hr">
  <div class="f">GitHub-токен (нужно только право gist)<input id="tk" type="password" autocomplete="off" placeholder="ghp_…" value="${esc(sync.token||'')}"></div>
  <p class="msg"><a href="https://github.com/settings/tokens/new?scopes=gist&description=App%20Backup" target="_blank" rel="noopener" style="color:var(--ac)">Создать токен</a>. В поле Expiration выберите «No expiration», иначе токен перестанет работать через 30 дней.</p>
  <div class="act"><button class="btn g" id="ts">Сохранить токен</button></div>
  ${sync.token?`<hr class="hr"><p class="msg">Последний бэкап в облако: ${fmt(sync.lastBackup)}. Это ручной перенос, а не автосинхронизация: сделайте бэкап на одном устройстве и восстановите на другом.</p>
  <div class="act"><button class="btn" id="bk">Сделать бэкап сейчас</button><button class="btn g" id="rs">Восстановить из бэкапа</button></div>`:''}
  <div class="msg ${cls||''}" id="sm">${esc(msg||'')}</div>
  <div class="act"><button class="btn g" data-x>Закрыть</button></div>`,()=>{
    const say=(t,c)=>{const e=$('#sm');if(e){e.textContent=t;e.className='msg '+(c||'')}};
    const run=async(fn,b)=>{b.disabled=true;try{await fn()}catch(e){say(e instanceof SyntaxError?'Бэкап повреждён.':e.message,'e')}b.disabled=false};
    $('#ts').onclick=()=>{const t=$('#tk').value.trim();if(t!==sync.token){sync.gistId=null;sync.lastBackup=null}sync.token=t;saveSync();banner();settings(t?'Токен сохранён.':'Токен удалён.','o')};
    const bk=$('#bk'),rs=$('#rs');
    if(bk)bk.onclick=()=>run(async()=>{say('Сохраняю…');await doBackup();settings('Бэкап сделан.','o')},bk);
    if(rs)rs.onclick=()=>run(async()=>{
      say('Ищу бэкап…');const d=await fetchBackup();
      if(!d)return say('На этом аккаунте бэкапов не найдено','e');
      open(`<h3>Восстановить из бэкапа?</h3><p>Это заменит текущие данные. Действие необратимо.</p><div class="act"><button class="btn g" data-x>Отмена</button><button class="btn d" id="go">Заменить</button></div>`,()=>{
        $('#go').onclick=()=>{S=d;save();close();render()}})
    },rs);
  });
}
$('#st').onclick=()=>settings();

render();
quick('inbox');
</script>
</body>
</html>
